# Puerto en el que corre este microservicio
server.port=8081

# Nombre de la aplicacion
spring.application.name=usuario-service

# --- Conexion a MySQL ---
# Antes de correr la app, crea la base de datos con: CREATE DATABASE usuario_db;
spring.datasource.url=jdbc:mysql://localhost:3306/usuario_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# "update" crea/actualiza las tablas automaticamente segun las entidades (@Entity)
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola el SQL que genera Hibernate (util para revisar que esta pasando)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Eureka ---
# Le dice a este microservicio donde esta el Eureka Server para registrarse
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
